version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Q3 keeps the Node runtime pin a deliberate change.
      - dependency-name: "node"
      - dependency-name: "@types/node"
        versions: [">=25"]
      # Keep the exact compiler pin and respect current lint peer constraints.
      - dependency-name: "babel-plugin-react-compiler"
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
