# coverage.status.project below is configured but inert: Codecov's Project Coverage
# status check requires the Pro plan and this org is on Team (confirmed with Codecov
# support 2026-08-25). Only codecov/patch will ever post here on the current plan.
# Coverage is independently guarded in CI by vitest.config.mts's enforced 100%
# thresholds. Left in place as documentation should the plan ever change.
coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        target: 100%
        threshold: 0%
        if_ci_failed: error

comment:
  layout: "header, diff, flags, components"

component_management:
  individual_components:
    - component_id: lib
      name: "Business logic (src/lib)"
      paths:
        - "src/lib/**"
    - component_id: components
      name: "UI components (src/components)"
      paths:
        - "src/components/**"
    - component_id: app
      name: "Routes & pages (src/app)"
      paths:
        - "src/app/**"
    - component_id: app_api
      name: "API route handlers (src/app/api)"
      paths:
        - "src/app/api/**"
