# Hypothesis test 2026-08-25: confirm codecov/project posts now that the learned
# repository YAML shows current config (see PROJECT.md OPEN item).
coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        target: 100%
        threshold: 0%
        if_ci_failed: error

comment:
  layout: "header, diff, flags, components"

component_management:
  individual_components:
    - component_id: lib
      name: "Business logic (src/lib)"
      paths:
        - "src/lib/**"
    - component_id: components
      name: "UI components (src/components)"
      paths:
        - "src/components/**"
    - component_id: app
      name: "Routes & pages (src/app)"
      paths:
        - "src/app/**"
    - component_id: app_api
      name: "API route handlers (src/app/api)"
      paths:
        - "src/app/api/**"
